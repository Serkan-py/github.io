<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edanur & Serkan · Önizleme</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eae8e1;color:#25483e;font:14px/1.4 system-ui,sans-serif}header{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding:12px 20px;background:#faf8f2;border-bottom:1px solid #d1c9b9}strong{display:block;font:600 18px Georgia,serif}small{color:#526158}nav{display:flex;gap:6px;flex-wrap:wrap}button,a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 14px;border:1px solid #bfb6a6;border-radius:24px;background:none;color:#25483e;font:600 13px system-ui;text-decoration:none;cursor:pointer}button[aria-pressed=true]{background:#25483e;color:#faf8f2}button:focus-visible,a:focus-visible{outline:2px solid #25483e;outline-offset:2px}.stage{padding:20px 12px 30px;overflow:auto}iframe{display:block;width:100%;max-width:1440px;height:900px;border:0;margin:0 auto;background:#faf8f2;box-shadow:0 12px 45px #28312925}.note{text-align:center;color:#526158;font-size:13px;margin:0 0 18px}@media(max-width:600px){header{padding:10px 12px}.stage{padding-inline:0}iframe{max-width:100%}button,a{padding:6px 10px}}</style></head>
<body><header><div><strong>Edanur & Serkan</strong><small>Yerel önizleme · Canlı site değişmez.</small></div><nav aria-label="Önizleme genişliği"><button data-width="375" aria-pressed="false">375 px</button><button data-width="390" aria-pressed="false">390 px</button><button data-width="430" aria-pressed="false">430 px</button><button data-width="desktop" aria-pressed="true">Masaüstü</button><a href="index.html">Tam sayfa</a></nav></header><main class="stage"><p class="note">Sayfanın içinde aşağı kaydırın. Telefonda doğrudan “Tam sayfa” ile açabilirsiniz.</p><iframe id="preview" src="index.html" title="Davetiyenin son hali" allow="autoplay"></iframe></main>
<script>const frame=document.querySelector('#preview');document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{const mode=button.dataset.width;document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));frame.style.width=mode==='desktop'?'100%':mode+'px';frame.style.height=mode==='desktop'?'900px':mode==='375'?'812px':mode==='430'?'932px':'844px';frame.src='index.html';}));</script></body></html>
